version: v1.0
name: Verification Pipeline
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
  containers:
    - name: main
      image: 'registry.semaphoreci.com/android:29'
global_job_config:
  env_vars:
    - name: ADB_INSTALL_TIMEOUT
      value: '10'
  prologue:
    commands:
      - checkout
      - cache restore gradle-wrapper
      - cache restore gradle-cache
      - cache restore android-build
blocks:
  - name: Block 1
    task:
      jobs:
        - name: Job A
          commands:
            - sem-context put test=123
      agent:
        machine:
          type: e2-standard-2
          os_image: ubuntu2404
  - name: Block 2
    task:
      jobs:
        - name: Job B
          commands:
            - echo hello
      epilogue:
        always:
          commands:
            - artifact push job --expire-in 2w --destination reports/ app/build/reports/
  - name: Block 3
    task:
      jobs:
        - name: Job C
          commands:
            - sem-context get test
promotions:
  - name: Start Integration tests
    pipeline_file: integration-tests.yml
